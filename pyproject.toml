[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "CLI-first astrodynamics framework: TLE ingestion, orbit propagation, orbit determination, and conjunction assessment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Rohan Pattanayak" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sgp4>=2.22",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "flake8>=7.0"]

[project.scripts]
ariadne = "ariadne.cli.main:main"

[tool.setuptools.packages.find]
include = ["ariadne*"]
